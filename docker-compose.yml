name: bigdata-lab

services:

  namenode:
    image: bde2020/hadoop-namenode:${HADOOP_IMAGE_TAG}
    container_name: namenode
    hostname: namenode
    restart: unless-stopped

    environment:
      CLUSTER_NAME: ${CLUSTER_NAME}
      CORE_CONF_fs_defaultFS: ${CORE_CONF_FS_DEFAULT}
      HDFS_CONF_dfs_replication: ${HDFS_REPLICATION}

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - ./data/hadoop/namenode:/hadoop/dfs/name

    networks:
      - bigdata-network

  datanode:
      image: bde2020/hadoop-datanode:${HADOOP_IMAGE_TAG}
      container_name: datanode
      hostname: datanode
      restart: unless-stopped

      depends_on:
        - namenode

      environment:
        CLUSTER_NAME: ${CLUSTER_NAME}
        CORE_CONF_fs_defaultFS: ${CORE_CONF_FS_DEFAULT}
        HDFS_CONF_dfs_replication: ${HDFS_REPLICATION}
        SERVICE_PRECONDITION: "namenode:9870"

      volumes:
        - ./data/hadoop/datanode:/hadoop/dfs/data

      networks:
        - bigdata-network

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:${HADOOP_IMAGE_TAG}
    container_name: resourcemanager
    hostname: resourcemanager
    restart: unless-stopped

    depends_on:
      - namenode
      - datanode

    environment:
      CLUSTER_NAME: ${CLUSTER_NAME}
      CORE_CONF_fs_defaultFS: ${CORE_CONF_FS_DEFAULT}
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864"

    ports:
      - "8088:8088"

    networks:
      - bigdata-network

  nodemanager:
      image: bde2020/hadoop-nodemanager:${HADOOP_IMAGE_TAG}
      container_name: nodemanager
      hostname: nodemanager
      restart: unless-stopped

      depends_on:
        - resourcemanager

      environment:
        CLUSTER_NAME: ${CLUSTER_NAME}
        CORE_CONF_fs_defaultFS: ${CORE_CONF_FS_DEFAULT}
        YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
        SERVICE_PRECONDITION: "resourcemanager:8088"

      networks:
        - bigdata-network

  historyserver:
    image: bde2020/hadoop-historyserver:${HADOOP_IMAGE_TAG}
    container_name: historyserver
    hostname: historyserver
    restart: unless-stopped

    depends_on:
      - namenode

    environment:
      CLUSTER_NAME: ${CLUSTER_NAME}
      CORE_CONF_fs_defaultFS: ${CORE_CONF_FS_DEFAULT}
      SERVICE_PRECONDITION: "namenode:9870"

    volumes:
      - ./data/hadoop/history:/hadoop/yarn/timeline

    networks:
      - bigdata-network

  spark-master:
    build:
      context: ./spark
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    depends_on:
      - namenode
      - resourcemanager

    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop

    ports:
      - "${SPARK_MASTER_PORT}:7077"
      - "${SPARK_MASTER_WEBUI_PORT}:8080"

    volumes:
      - ./hadoop/conf:/opt/bigdata/conf/hadoop:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties
      - ./spark/apps:/opt/spark/apps
      - ./data/spark/events:/tmp/spark-events

    networks:
      - bigdata-network

  spark-worker:
    build:
      context: ./spark
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped

    depends_on:
      - spark-master

    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop

    command: >
        /opt/spark/bin/spark-class
        org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077

    ports:
      - "${SPARK_WORKER_WEBUI_PORT}:8081"

    volumes:
        - ./hadoop/conf:/opt/bigdata/conf/hadoop:ro
        - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
        - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties
        - ./spark/apps:/opt/spark/apps
        - ./data/spark/events:/tmp/spark-events

    networks:
      - bigdata-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - bigdata-network

  hive-metastore:

    build:
      context: ./hive

    container_name: hive-metastore

    depends_on:
      - postgres
      - namenode

    environment:
      SERVICE_NAME: metastore
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop

    ports:
      - "9083:9083"

    volumes:
      - ./hive/conf:/opt/hive/conf
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro

    networks:
      - bigdata-network

  hive-server:

    build:
      context: ./hive

    container_name: hive-server

    hostname: hive-server

    restart: unless-stopped

    depends_on:
      - hive-metastore

    environment:
      SERVICE_NAME: hiveserver2
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop

    ports:
      - "10000:10000"

    volumes:
    - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro

    networks:
      - bigdata-network

  jupyter:
    build:
      context: ./jupyter

    container_name: jupyter
    hostname: jupyter

    restart: unless-stopped
  
    depends_on:
      - spark-master
      - hive-metastore

    environment:
      SPARK_HOME: /opt/spark
      HADOOP_CONF_DIR: /opt/bigdata/conf/hadoop
      JUPYTER_RUNTIME_DIR: /tmp/jupyter-runtime

      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3

    ports:
      - "8888:8888"

    volumes:
      # Notebooks persistentes
      - ./data/notebooks:/workspace
      # Configuración compartida de Hadoop
      - ./hadoop/conf:/opt/bigdata/conf/hadoop:ro
      # Configuración compartida de Spark
      - ./spark/conf:/opt/spark/conf:ro
      # JARs compartidos
      #- ./spark/jars:/opt/spark/jars:ro
      # Aplicaciones Spark (opcional pero recomendable)
      - ./spark/apps:/opt/spark/apps:ro
      # Directorio de eventos (opcional)
      - ./data/spark/events:/tmp/spark-events

    networks:
      - bigdata-network

networks:
  bigdata-network:
    driver: bridge